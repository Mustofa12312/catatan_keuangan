name: kas_keluarga
description: "Aplikasi tabungan titipan offline berbasis Android."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  fl_chart: ^0.70.0
  lottie: ^3.3.1
  share_plus: ^10.1.3
  screenshot: ^3.0.0
  path_provider: ^2.1.5
  pdf: ^3.12.0
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animation/
    - assets/logo/
